<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calculadora de Limites com Passo a Passo</title>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css"
      integrity="sha384-n8MVd4RsNIU0tAv4ct0nTaAbDJwPJzDEaqSD1odI+WdtXRGWt2kTvGFasHpSy3SV"
      crossorigin="anonymous">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"
        integrity="sha384-XjKyOOlGwcjNTAIQHIpgOno0Hl1YQqzUOEleOLALmuqehneUG+vnGctmUb0ZY0l8"
        crossorigin="anonymous"></script>

<link rel="stylesheet" href="estilo.css">
</head>
<body>
<div class="container">
  <header>
    <h1>Calculadora de Limites com Passo a Passo</h1>
    <p class="subtitulo">
      Digite uma função de <em>x</em> e o valor para onde <em>x</em> tende.
      Os limites laterais são calculados automaticamente.
    </p>
  </header>

  <form id="form-limite" novalidate>
    <div class="campo">
      <label for="campo-funcao">Função f(x)</label>
      <input
        type="text"
        id="campo-funcao"
        name="funcao"
        placeholder="Ex.: (x^2-4)/(x-2)"
        autocomplete="off"
        required
      >
    </div>

    <div class="campo">
      <label for="campo-ponto">x tende a</label>
      <input
        type="text"
        id="campo-ponto"
        name="ponto"
        placeholder="2, infinito ou -infinito"
        autocomplete="off"
        required
      >
    </div>

    <button type="submit" id="botao-calcular">Calcular</button>
  </form>

  <p id="indicador-carregando" class="carregando" hidden role="status">Calculando...</p>

  <div id="area-erro" class="erro" hidden role="alert"></div>

  <section id="area-resultado" aria-live="polite"></section>
</div>

<script src="js/api.js"></script>
<script src="js/passos.js"></script>
</body>
</html>
